[package]
name = "fiddlehead"
version = "0.1.0"
description = "Transformer training monitor — Tauri desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "1", features = ["window-all"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
